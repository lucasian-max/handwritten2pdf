<line x1="40" y1="1256" x2="960" y2="1256" stroke="#cfe0f0" stroke-width="1.2"/>
<line x1="40" y1="1318" x2="960" y2="1318" stroke="#cfe0f0" stroke-width="1.2"/>
<line x1="86" y1="90" x2="86" y2="1364" stroke="#e8a0a0" stroke-width="1.5"/>
<text x="149.4" y="120.2" font-family="Z003" font-size="58" fill="#1a3fa0" transform="rotate(-0.88 149.4 120.2)">Gauss's Law</text>
<path d="M150,138 q120,8 290,2" stroke="#1a3fa0" stroke-width="2.5" fill="none"/>
<text x="110.1" y="209.8" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-2.14 110.1 209.8)">Electric flux through a closed</text>
<text x="110.0" y="253.3" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-2.21 110.0 253.3)">surface S:</text>
<text x="189.9" y="317.5" font-family="Nimbus Roman" font-size="38" fill="#1a3fa0" font-style="italic" transform="rotate(-0.98 189.9 317.5)">&#934;E  =  &#8751;S  E &#183; dA</text>
<text x="110.5" y="409.4" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-0.38 110.5 409.4)">Field of a point charge q,</text>
<text x="110.2" y="454.7" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-1.38 110.2 454.7)">sphere of radius r around q:</text>
<text x="200.1" y="517.9" font-family="Nimbus Roman" font-size="36" fill="#1a3fa0" font-style="italic" transform="rotate(1.14 200.1 517.9)">E  =  q / (4&#960;&#603;&#8320; r&#178;)</text>
<circle cx="250" cy="740" r="90" fill="none" stroke="#1a3fa0" stroke-width="2.6"/>
<line x1="250" y1="740" x2="315" y2="675" stroke="#1a3fa0" stroke-width="2"/>
<polygon points="323,675 311,672 313,684" fill="#1a3fa0"/>
<text x="289.0" y="701.3" font-family="Z003" font-size="30" fill="#1a3fa0" transform="rotate(-2.27 289.0 701.3)">r</text>
<text x="239.4" y="773.7" font-family="Z003" font-size="30" fill="#1a3fa0" transform="rotate(-1.78 239.4 773.7)">q</text>
<line x1="290" y1="560" x2="385" y2="535" stroke="#1a3fa0" stroke-width="2.4"/>
<polygon points="394,533 380,526 384,543" fill="#1a3fa0"/>
<text x="401.5" y="538.1" font-family="Z003" font-size="30" fill="#1a3fa0" transform="rotate(1.58 401.5 538.1)">E</text>
<text x="353.8" y="752.1" font-family="Z003" font-size="28" fill="#1a3fa0" transform="rotate(0.69 353.8 752.1)">S</text>
<text x="469.3" y="699.5" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-2.19 469.3 699.5)">Flux through S:</text>
<text x="470.2" y="761.9" font-family="Nimbus Roman" font-size="33" fill="#1a3fa0" font-style="italic" transform="rotate(-0.45 470.2 761.9)">&#934;E = E&#183;4&#960;r&#178;</text>
<text x="470.1" y="821.9" font-family="Nimbus Roman" font-size="33" fill="#1a3fa0" font-style="italic" transform="rotate(-0.48 470.1 821.9)">= (q/4&#960;&#603;&#8320;r&#178;) &#183; 4&#960;r&#178;</text>
<text x="470.4" y="882.2" font-family="Nimbus Roman" font-size="36" fill="#1a3fa0" font-style="italic" transform="rotate(-0.61 470.4 882.2)">= q&#8339;&#8345;&#8342; / &#603;&#8320;</text>
<text x="110.0" y="960.6" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(0.37 110.0 960.6)">Flux depends only on the charge</text>
<text x="109.7" y="1004.8" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(1.15 109.7 1004.8)">enclosed by S - not on r!</text>
<text x="109.9" y="1068.4" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-1.91 109.9 1068.4)">Note: works for any closed</text>
<text x="110.0" y="1111.3" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-1.74 110.0 1111.3)">surface around q (no sharp</text>
<text x="110.4" y="1156.1" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(0.84 110.4 1156.1)">corners needed).</text>
</svg>