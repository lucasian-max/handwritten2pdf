<text x="130.1" y="120.7" font-family="Z003" font-size="56" fill="#1a3fa0" transform="rotate(-0.24 130.1 120.7)">Integration by Parts</text>
<path d="M130,140 q150,8 380,2" stroke="#1a3fa0" stroke-width="2.5" fill="none"/>
<text x="110.0" y="210.1" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-0.17 110.0 210.1)">From the product rule for</text>
<text x="110.0" y="254.2" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-1.58 110.0 254.2)">derivatives:</text>
<text x="220.4" y="317.5" font-family="Nimbus Roman" font-size="36" fill="#1a3fa0" font-style="italic" transform="rotate(-0.47 220.4 317.5)">(uv)&#8242;  =  u&#8242;v + uv&#8242;</text>
<text x="110.5" y="410.3" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-2.05 110.5 410.3)">Integrate both sides, move</text>
<text x="110.8" y="454.7" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-2.29 110.8 454.7)">one term across:</text>
<text x="190.2" y="518.1" font-family="Nimbus Roman" font-size="38" fill="#1a3fa0" font-style="italic" transform="rotate(-0.82 190.2 518.1)">&#8747; u dv  =  uv &#8722; &#8747; v du</text>
<text x="110.0" y="617.3" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-2.42 110.0 617.3)">Example. Take</text>
<text x="109.6" y="665.7" font-family="Nimbus Roman" font-size="34" fill="#1a3fa0" font-style="italic" transform="rotate(-1.13 109.6 665.7)">&#8747; x e&#7491; dx</text>
<text x="149.9" y="714.5" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-0.18 149.9 714.5)">choose u = x, dv = e&#7491;dx</text>
<text x="150.2" y="776.0" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(0.10 150.2 776.0)">then du = dx, v = e&#7491;</text>
<text x="170.2" y="867.9" font-family="Nimbus Roman" font-size="34" fill="#1a3fa0" font-style="italic" transform="rotate(-0.53 170.2 867.9)">&#8747; x e&#7491; dx  =  x e&#7491; &#8722; &#8747; e&#7491; dx</text>
<text x="260.6" y="948.6" font-family="Nimbus Roman" font-size="36" fill="#1a3fa0" font-style="italic" transform="rotate(0.82 260.6 948.6)">= (x &#8722; 1) e&#7491; + C</text>
<text x="109.7" y="1039.6" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(1.04 109.7 1039.6)">Check: differentiate the</text>
<text x="109.3" y="1084.4" font-family="Z003" font-size="34" fill="#1a3fa0" transform="rotate(-1.05 109.3 1084.4)">answer - you get x e&#7491; back.</text>
<line x1="700" y1="850" x2="930" y2="850" stroke="#1a3fa0" stroke-width="2.2"/>
