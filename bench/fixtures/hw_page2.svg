<text x="830.6" y="549.8" font-family="Z003" font-size="30" fill="#1a3fa0" transform="rotate(-0.50 830.6 549.8)">y = x e&#7491;</text>
<path d="M 700,850 C 790,790 850,690 910,530" fill="none" stroke="#1a3fa0" stroke-width="2.6"/>
<text x="925.6" y="874.2" font-family="Z003" font-size="28" fill="#1a3fa0" transform="rotate(2.29 925.6 874.2)">x</text>
<text x="672.7" y="525.0" font-family="Z003" font-size="28" fill="#1a3fa0" transform="rotate(-1.45 672.7 525.0)">y</text>
</svg>